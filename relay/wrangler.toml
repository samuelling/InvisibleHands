name = "invisible-hands"
main = "worker.js"
compatibility_date = "2026-06-01"

# Anyone can connect, no key needed. These are the editors' sites, which may use the keys page (/admin).
# "http://localhost:*" matches any port.
[vars]
HOUSE_ORIGINS = "https://samuelling.github.io https://crumplabsandbox.github.io https://megazine.org https://megazinehq.github.io http://localhost:* http://127.0.0.1:*"
# The month's ceiling, in incoming frames, for everyone together. 20 frames bill as one Durable Objects
# request and the Workers Paid plan includes 1,000,000 a month, so 18M frames stays inside it.
MONTHLY_FRAMES = "18000000"
# The default ceiling for an app given a key (keys are optional; the editors hand them out on request).
KEY_MONTHLY_FRAMES = "2000000"
REPORT_SECONDS = "60"
CACHE_SECONDS = "60"
# Also needed, as a secret (never in this file):  npx wrangler secret put ADMIN_TOKEN

[[kv_namespaces]]
binding = "KEYS"
id = "b84d71cb30e54c8f83ec597c8023642b"

# New connections: 30 a minute from one IP address, 120 a minute with one key (per Cloudflare location).
[[ratelimits]]
name = "CONNECTS"
namespace_id = "48101"
  [ratelimits.simple]
  limit = 30
  period = 60

[[ratelimits]]
name = "KEY_CONNECTS"
namespace_id = "48102"
  [ratelimits.simple]
  limit = 120
  period = 60

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[durable_objects.bindings]]
name = "METER"
class_name = "Meter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Meter"]
